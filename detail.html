<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where in the world?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />

  <body>

    <main class="main-content detail-main">
      <div class="back-btn-container">
        <a href="/" id="back-btn" class="btn back-btn">
          <span>&larr;</span> Back

      </div>

      <section id="country-detail" class="detail-container">
        <p style="color: var(--text-muted); font-size: 1.1rem;">Loading country details...</p>

    <script type="module" src="/src/details.ts"></script>
